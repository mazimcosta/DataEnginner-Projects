
name: Pipeline incremental

on: 
    push:
      paths:
      - "pipeline_incremental/**"
      - ".github/workflows/pipeline_incremental.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline_incremental
    env:
      # Make the pipeline_incremental folder importable as top-level packages
      PYTHONPATH: ${{ github.workspace }}/pipeline_incremental

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5

      - name: Instalar python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalando dependencias
        run: pip install -r requirements.txt

      - name: Preparar ambiente para testes
        run: |
          # create logs dir and a minimal pipeline.log (test_logger expects specific strings)
          mkdir -p logs
          echo "Iniciando pipeline" > logs/pipeline.log
          echo "Pipeline finalizado com sucesso" >> logs/pipeline.log

      - name: Executando testes
        run: pytest tests/unit/