
name: Pipeline Medalhão

on:
  push:
    paths:
      - "pipeline_sql/**"
      - ".github/workflows/pipeline_sql.yml"

  pull_request:
    paths:
      - "pipeline_sql/**"
      - ".github/workflows/pipeline_sql.yml"

jobs:
  testes:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pipeline_sql

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar testes
        run: pytest tests/